<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans flex justify-center items-center min-h-screen bg-gray-100">

    <div id="chat-container" class="w-4/5 max-w-3xl bg-white rounded-lg shadow-lg flex flex-col h-[80vh]">
        <div id="status" class="p-2.5 text-center bg-gray-50 text-sm text-gray-600">Loading model...</div>
        <div id="messages" class="flex-grow overflow-y-auto p-5 border-b border-gray-300"></div>
        <div id="input-area" class="flex p-5 items-center">
            <input type="text" id="input-text" placeholder="Ask me anything..." disabled class="flex-grow border border-gray-300 rounded-full py-2 px-4 text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button id="send-button" disabled class="bg-blue-500 text-white rounded-full w-10 h-10 ml-2.5 cursor-pointer text-2xl flex justify-center items-center hover:bg-blue-600 disabled:bg-gray-300 disabled:cursor-not-allowed">&#x27A4;</button>
        </div>
    </div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2/dist/transformers.min.js';

        // Skip local model check
        env.allowLocalModels = false;

        const status = document.getElementById('status');
        const messages = document.getElementById('messages');
        const inputText = document.getElementById('input-text');
        const sendButton = document.getElementById('send-button');

        status.textContent = 'Loading model (Xenova/LaMini-Flan-T5-77M)...';

        // Create a new text-generation pipeline
        const generator = await pipeline('text2text-generation', 'Xenova/LaMini-Flan-T5-77M');

        status.textContent = 'Model loaded. You can now chat.';
        inputText.disabled = false;
        sendButton.disabled = false;

        async function generateResponse(prompt) {
            addMessage(prompt, 'user');
            inputText.value = '';
            inputText.disabled = true;
            sendButton.disabled = true;
            addMessage('...', 'bot', true);

            const result = await generator(prompt, {
                max_new_tokens: 100,
                temperature: 0.7,
                top_k: 50,
                do_sample: true,
            });

            const response = result[0].generated_text;
            updateLastBotMessage(response);
            inputText.disabled = false;
            sendButton.disabled = false;
            inputText.focus();
        }

        function addMessage(text, sender, isTyping = false) {
            const messageContainer = document.createElement('div');
            messageContainer.className = `mb-4 leading-normal ${sender === 'user' ? 'text-right' : ''}`;
            if (isTyping) {
                messageContainer.classList.add('typing');
            }

            const contentDiv = document.createElement('div');
            contentDiv.className = `inline-block py-2 px-4 rounded-2xl ${sender === 'user' ? 'bg-blue-500 text-white' : 'bg-gray-200 text-black'}`;
            contentDiv.textContent = text;

            messageContainer.appendChild(contentDiv);
            messages.appendChild(messageContainer);
            messages.scrollTop = messages.scrollHeight;
        }

        function updateLastBotMessage(text) {
            const typingMessage = messages.querySelector('.typing .inline-block');
            if (typingMessage) {
                typingMessage.textContent = text;
                typingMessage.parentElement.classList.remove('typing');
            }
        }

        sendButton.addEventListener('click', () => {
            const prompt = inputText.value.trim();
            if (prompt) {
                generateResponse(prompt);
            }
        });

        inputText.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                sendButton.click();
            }
        });

    </script>

</body>
</html>
