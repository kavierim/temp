<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isometric Voxel Engine</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            color: white;
            pointer-events: none;
            /* Let clicks pass through to canvas */
            user-select: none;
        }

        .ui-element {
            pointer-events: auto;
            /* Re-enable clicks for buttons */
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #4caf50;
        }

        button {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.2s;
        }

        button:hover {
            background: #444;
        }

        button.active {
            background: #4caf50;
            border-color: #4caf50;
        }
    </style>
    <!-- Load Three.js -->
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
</head>

<body>
    <div id="ui-container">
        <h1>Voxel Engine</h1>
        <div class="ui-element">
            <div id="voxel-selector">
                <!-- Buttons will be injected here -->
            </div>
        </div>
        <div class="ui-element" style="font-size: 12px; color: #aaa;">
            Left Click: Place Voxel<br>
            Right Click: Remove
        </div>
    </div>

    <script>
        // --- Constants & Config ---
        const GRID_SIZE = 20;
        const VOXEL_SIZE = 1;

        // --- Base Classes ---

        /**
         * Base class for all voxel entities.
         */
        class VoxelEntity {
            constructor(position, typeId, world) {
                this.position = position.clone();
                this.typeId = typeId;
                this.world = world;
                this.mesh = null;
                this.isDead = false;
            }

            // Initialize mesh - to be implemented by subclasses or factory
            init(scene) {
                // Create mesh here
            }

            update(deltaTime, time) {
                // Override for active behavior
            }

            dispose(scene) {
                if (this.mesh) {
                    scene.remove(this.mesh);
                    if (this.mesh.geometry) this.mesh.geometry.dispose();
                    if (this.mesh.material) {
                        if (Array.isArray(this.mesh.material)) {
                            this.mesh.material.forEach(m => m.dispose());
                        } else {
                            this.mesh.material.dispose();
                        }
                    }
                }
            }
        }

        // --- Voxel Registry ---

        class VoxelRegistry {
            static types = new Map();
            static listeners = [];

            static register(typeId, name, factoryFn) {
                this.types.set(typeId, { name, factoryFn });
                this.notifyListeners();
            }

            static create(typeId, position, world) {
                const type = this.types.get(typeId);
                if (!type) {
                    console.error(`Voxel type '${typeId}' not found.`);
                    return null;
                }
                return type.factoryFn(position, world);
            }

            static getTypes() {
                return Array.from(this.types.entries()).map(([id, data]) => ({ id, name: data.name }));
            }

            static subscribe(callback) {
                this.listeners.push(callback);
                callback(this.getTypes()); // Immediate callback
            }

            static notifyListeners() {
                const types = this.getTypes();
                this.listeners.forEach(cb => cb(types));
            }
        }

        // --- World Manager ---

        class WorldManager {
            constructor() {
                this.entities = [];
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();
                this.clock = new THREE.Clock();

                this.currentVoxelType = 'stone'; // Default

                this.init();
                this.setupInputs();
                this.setupUI();
                this.animate();
            }

            init() {
                // Scene
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x202020);

                // Camera - Isometric Orthographic
                const aspect = window.innerWidth / window.innerHeight;
                const d = 15;
                this.camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);

                // Isometric view position
                this.camera.position.set(20, 20, 20);
                this.camera.lookAt(this.scene.position); // Look at 0,0,0

                // Renderer
                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                document.body.appendChild(this.renderer.domElement);

                // Lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
                this.scene.add(ambientLight);

                const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
                dirLight.position.set(10, 20, 5);
                dirLight.castShadow = true;
                dirLight.shadow.mapSize.width = 2048;
                dirLight.shadow.mapSize.height = 2048;
                const dLight = 20;
                dirLight.shadow.camera.left = -dLight;
                dirLight.shadow.camera.right = dLight;
                dirLight.shadow.camera.top = dLight;
                dirLight.shadow.camera.bottom = -dLight;
                this.scene.add(dirLight);

                // Initial Ground Generation
                this.generateGround();
            }

            generateGround() {
                const geometry = new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE);
                const material = new THREE.MeshStandardMaterial({ color: 0x4caf50 });
                const plane = new THREE.Mesh(geometry, material);
                plane.rotation.x = -Math.PI / 2;
                plane.position.y = -0.5; // Slightly below 0
                plane.receiveShadow = true;
                plane.name = "GroundPlane"; // For raycasting
                this.scene.add(plane);
            }

            addEntity(entity) {
                entity.init(this.scene);
                this.entities.push(entity);
            }

            removeEntity(entity) {
                entity.dispose(this.scene);
                const index = this.entities.indexOf(entity);
                if (index > -1) {
                    this.entities.splice(index, 1);
                }
            }

            isOccupied(position) {
                const epsilon = 0.1;
                return this.entities.some(e => e.position.distanceTo(position) < epsilon);
            }

            setupInputs() {
                window.addEventListener('resize', () => {
                    const aspect = window.innerWidth / window.innerHeight;
                    const d = 15;
                    this.camera.left = -d * aspect;
                    this.camera.right = d * aspect;
                    this.camera.top = d;
                    this.camera.bottom = -d;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });

                window.addEventListener('pointerdown', (event) => this.onPointerDown(event));
                // Prevent context menu on right click
                window.addEventListener('contextmenu', (e) => e.preventDefault());
            }

            setupUI() {
                VoxelRegistry.subscribe((types) => {
                    const container = document.getElementById('voxel-selector');
                    container.innerHTML = '';
                    types.forEach(type => {
                        const btn = document.createElement('button');
                        btn.textContent = type.name;
                        btn.onclick = () => {
                            this.currentVoxelType = type.id;
                            Array.from(container.children).forEach(c => c.classList.remove('active'));
                            btn.classList.add('active');
                        };
                        if (type.id === this.currentVoxelType) btn.classList.add('active');
                        container.appendChild(btn);
                    });
                });
            }

            onPointerDown(event) {
                event.preventDefault();

                this.mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                this.mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

                this.raycaster.setFromCamera(this.mouse, this.camera);

                const intersects = this.raycaster.intersectObjects(this.scene.children, true);

                if (intersects.length > 0) {
                    const intersect = intersects[0];

                    // 0 = Left Click (Add), 2 = Right Click (Remove)
                    if (event.button === 2) {
                        // Remove
                        if (intersect.object.userData.entity) {
                            const entity = intersect.object.userData.entity;
                            this.removeEntity(entity);
                        }
                    } else if (event.button === 0) {
                        // Add
                        const normal = intersect.face.normal.clone();
                        normal.transformDirection(intersect.object.matrixWorld).round();

                        const point = intersect.point.clone();
                        const position = point.add(normal.multiplyScalar(VOXEL_SIZE * 0.5)).floor().addScalar(VOXEL_SIZE * 0.5);

                        if (!this.isOccupied(position)) {
                            const entity = VoxelRegistry.create(this.currentVoxelType, position, this);
                            if (entity) this.addEntity(entity);
                        }
                    }
                }
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                const deltaTime = this.clock.getDelta();
                const time = this.clock.getElapsedTime();

                this.entities.forEach(entity => entity.update(deltaTime, time));

                this.renderer.render(this.scene, this.camera);
            }
        }

        // --- Implementation of Concrete Voxels ---

        // 1. Static Voxel (Stone)
        class StaticVoxel extends VoxelEntity {
            constructor(position, world) {
                super(position, 'stone', world);
            }

            init(scene) {
                const geometry = new THREE.BoxGeometry(VOXEL_SIZE, VOXEL_SIZE, VOXEL_SIZE);
                const material = new THREE.MeshStandardMaterial({ color: 0x888888 });
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.copy(this.position);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
                this.mesh.userData.entity = this; // Link mesh to entity
                scene.add(this.mesh);
            }
        }

        // 2. Active Voxel (Wandering Voxel)
        class WanderingVoxel extends VoxelEntity {
            constructor(position, world) {
                super(position, 'wandering', world);
                this.targetPosition = position.clone();
                this.moveTimer = 0;
                this.moveInterval = 2.0; // Act every 2 seconds
                this.moveSpeed = 5.0; // Lerp speed
            }

            init(scene) {
                const geometry = new THREE.BoxGeometry(VOXEL_SIZE * 0.8, VOXEL_SIZE * 0.8, VOXEL_SIZE * 0.8);
                const material = new THREE.MeshStandardMaterial({ color: 0xff6f00 });
                this.mesh = new THREE.Mesh(geometry, material);
                this.mesh.position.copy(this.position);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = true;
                this.mesh.userData.entity = this; // Link mesh to entity
                scene.add(this.mesh);
            }

            update(deltaTime, time) {
                // Smooth Animation
                if (this.mesh) {
                    this.mesh.position.lerp(this.targetPosition, deltaTime * this.moveSpeed);
                }

                // Logic Timer
                this.moveTimer += deltaTime;
                if (this.moveTimer < this.moveInterval) return;
                this.moveTimer = 0;

                // 1. Void Death
                if (this.position.y < -10) {
                    this.world.removeEntity(this);
                    return;
                }

                // 2. Gravity
                const below = this.position.clone().add(new THREE.Vector3(0, -1, 0));
                // Check if space below is empty AND it's not the ground plane (y < 0)
                if (!this.world.isOccupied(below) && below.y >= 0) {
                    this.position.copy(below);
                    this.targetPosition.copy(below);
                    return; // Falling, so don't move sideways
                }

                // 3. Movement
                // Only move if standing on something (solid ground or another block)

                const dirs = [
                    new THREE.Vector3(1, 0, 0),
                    new THREE.Vector3(-1, 0, 0),
                    new THREE.Vector3(0, 0, 1),
                    new THREE.Vector3(0, 0, -1)
                ];
                const dir = dirs[Math.floor(Math.random() * dirs.length)];
                const nextPos = this.position.clone().add(dir);

                if (this.world.isOccupied(nextPos)) {
                    // 4. Climbing
                    // Blocked, check above the wall
                    const aboveNext = nextPos.clone().add(new THREE.Vector3(0, 1, 0));
                    const aboveSelf = this.position.clone().add(new THREE.Vector3(0, 1, 0));

                    // Need to check if space above self is clear to jump, AND space above target is clear
                    if (!this.world.isOccupied(aboveSelf) && !this.world.isOccupied(aboveNext)) {
                        this.position.copy(aboveNext);
                        this.targetPosition.copy(aboveNext);
                    }
                } else {
                    // Path clear
                    this.position.copy(nextPos);
                    this.targetPosition.copy(nextPos);
                }
            }
        }

        // --- Initialization ---

        // Register Types
        VoxelRegistry.register('stone', 'Stone Block', (pos, world) => new StaticVoxel(pos, world));
        VoxelRegistry.register('wandering', 'Wandering Voxel', (pos, world) => new WanderingVoxel(pos, world));

        // Start Engine
        const world = new WorldManager();

    </script>
</body>

</html>
