<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to Markdown (Live Review)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load PDF.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- Load Marked.js for Markdown Preview -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .drag-active { border-color: #3b82f6; background-color: #eff6ff; }

        /* Markdown Preview Styles (Tailwind resets these, so we need to restore them for the preview) */
        .markdown-preview { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; color: #374151; line-height: 1.6; }
        .markdown-preview h1 { font-size: 1.75em; font-weight: 700; margin-top: 1em; margin-bottom: 0.5em; color: #111827; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.2em; }
        .markdown-preview h2 { font-size: 1.5em; font-weight: 600; margin-top: 1em; margin-bottom: 0.5em; color: #1f2937; }
        .markdown-preview h3 { font-size: 1.25em; font-weight: 600; margin-top: 1em; margin-bottom: 0.5em; color: #374151; }
        .markdown-preview p { margin-bottom: 1em; }
        .markdown-preview ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
        .markdown-preview ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
        .markdown-preview li { margin-bottom: 0.25em; }
        .markdown-preview blockquote { border-left: 4px solid #e5e7eb; padding-left: 1em; font-style: italic; color: #6b7280; margin-bottom: 1em; }
        .markdown-preview code { background-color: #f3f4f6; padding: 0.2em 0.4em; border-radius: 0.25em; font-family: ui-monospace, monospace; font-size: 0.875em; }
        .markdown-preview pre { background-color: #1f2937; color: #f3f4f6; padding: 1em; border-radius: 0.5em; overflow-x: auto; margin-bottom: 1em; }
        .markdown-preview pre code { background-color: transparent; padding: 0; color: inherit; }
        .markdown-preview strong { font-weight: 600; color: #111827; }
        .markdown-preview hr { border: 0; border-top: 1px solid #e5e7eb; margin: 2em 0; }

        /* Resizer Styles */
        .resizer {
            width: 6px;
            background-color: #e2e8f0;
            cursor: col-resize;
            transition: background-color 0.2s;
            z-index: 20;
        }
        .resizer:hover, .resizer.resizing {
            background-color: #3b82f6;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden font-sans">

    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-4">
            <button id="sidebar-toggle" class="text-slate-400 hover:text-blue-600 transition-colors focus:outline-none">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold">
                    <i class="fa-brands fa-markdown"></i>
                </div>
                <h1 class="font-bold text-lg text-slate-700">PDF <span class="text-blue-600">Markdown</span> Studio</h1>
            </div>
        </div>
        <div class="text-xs text-slate-400 font-medium hidden sm:block">
            <i class="fa-solid fa-shield-halved mr-1"></i> 100% Client-Side
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar / Settings -->
        <aside id="sidebar" class="w-80 bg-white border-r border-slate-200 flex flex-col shrink-0 z-10 shadow-sm overflow-y-auto hidden md:flex transition-all duration-300">
            <div class="p-6 space-y-8">
                
                <!-- File Input Section -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Input File</label>
                    <div id="drop-zone" class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center transition-all cursor-pointer hover:border-blue-400 hover:bg-slate-50 group">
                        <input type="file" id="file-input" accept=".pdf" class="hidden">
                        <div class="w-12 h-12 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition-transform">
                            <i class="fa-solid fa-cloud-arrow-up text-xl"></i>
                        </div>
                        <p class="text-sm font-medium text-slate-600">Click or Drag PDF</p>
                        <p class="text-xs text-slate-400 mt-1" id="file-name">No file selected</p>
                    </div>
                </div>

                <!-- Heuristics -->
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Extraction Rules</label>
                    <div class="space-y-3">
                        <label class="flex items-center gap-3 p-2 hover:bg-slate-50 rounded-lg cursor-pointer border border-transparent hover:border-slate-200 transition-colors">
                            <input type="checkbox" id="opt-headers" checked class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <div class="text-sm">
                                <span class="font-medium text-slate-700">Detect Headers</span>
                                <p class="text-xs text-slate-400">Auto-tag # H1, ## H2</p>
                            </div>
                        </label>
                        <label class="flex items-center gap-3 p-2 hover:bg-slate-50 rounded-lg cursor-pointer border border-transparent hover:border-slate-200 transition-colors">
                            <input type="checkbox" id="opt-footers" checked class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <div class="text-sm">
                                <span class="font-medium text-slate-700">Strip Footers</span>
                                <p class="text-xs text-slate-400">Clean edges (top/bottom 5%)</p>
                            </div>
                        </label>
                        <label class="flex items-center gap-3 p-2 hover:bg-slate-50 rounded-lg cursor-pointer border border-transparent hover:border-slate-200 transition-colors">
                            <input type="checkbox" id="opt-breaks" checked class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <div class="text-sm">
                                <span class="font-medium text-slate-700">Smart Paragraphs</span>
                                <p class="text-xs text-slate-400">Join broken lines</p>
                            </div>
                        </label>
                        <label class="flex items-center gap-3 p-2 hover:bg-slate-50 rounded-lg cursor-pointer border border-transparent hover:border-slate-200 transition-colors">
                            <input type="checkbox" id="opt-page-breaks" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                            <div class="text-sm">
                                <span class="font-medium text-slate-700">Remove Page Breaks</span>
                                <p class="text-xs text-slate-400">Merge into one document</p>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Action Button -->
                <button id="convert-btn" disabled class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 disabled:cursor-not-allowed text-white font-bold py-3 rounded-xl transition-all shadow-md active:scale-95 flex items-center justify-center gap-2">
                    <span>Extract & Review</span>
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </button>
                
                <div id="status-area" class="hidden">
                    <div class="flex justify-between text-xs text-slate-500 mb-1">
                        <span id="status-text">Processing...</span>
                        <span id="status-percent">0%</span>
                    </div>
                    <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                        <div id="progress-bar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>

            </div>
        </aside>

        <!-- Editor & Preview Area -->
        <section id="main-section" class="flex-1 flex flex-col md:flex-row bg-slate-100 overflow-hidden relative">
            
            <!-- Left: Raw Markdown Editor -->
            <div id="left-panel" class="flex flex-col h-1/2 md:h-full border-r border-slate-200 bg-white" style="width: 50%;">
                <div class="px-4 py-2 border-b border-slate-100 bg-slate-50 text-xs font-bold text-slate-500 uppercase tracking-wider flex justify-between items-center">
                    <span><i class="fa-solid fa-code mr-2"></i>Raw Markdown</span>
                    <button id="copy-btn" class="hover:text-blue-600 transition-colors" title="Copy Raw Text">
                        <i class="fa-regular fa-copy"></i>
                    </button>
                </div>
                <textarea id="output-editor" class="flex-1 w-full resize-none p-6 font-mono text-sm leading-relaxed outline-none text-slate-700 overflow-y-auto" placeholder="1. Drag a PDF file&#10;2. Click Extract&#10;3. Review the Markdown here..."></textarea>
            </div>

            <!-- Resizer Handle -->
            <div id="resizer" class="resizer hidden md:block"></div>

            <!-- Right: Rendered Preview -->
            <div id="right-panel" class="flex-1 flex flex-col h-1/2 md:h-full bg-white">
                <div class="px-4 py-2 border-b border-slate-100 bg-slate-50 text-xs font-bold text-slate-500 uppercase tracking-wider flex justify-between items-center">
                    <span><i class="fa-solid fa-eye mr-2"></i>Preview</span>
                    <button id="download-btn" class="hover:text-blue-600 transition-colors" title="Download .md file">
                        <i class="fa-solid fa-download"></i>
                    </button>
                </div>
                <div id="preview-pane" class="flex-1 p-8 overflow-y-auto markdown-preview bg-white">
                    <p class="text-slate-400 italic text-center mt-10">Preview will appear here...</p>
                </div>
            </div>

        </section>

    </main>

    <script>
        // --- Configuration & State ---
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const state = {
            file: null,
            isProcessing: false,
            heuristics: {
                detectHeaders: true,
                stripFooters: true,
                smartParagraphs: true,
                removePageBreaks: false
            }
        };

        // --- DOM Elements ---
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileNameDisplay = document.getElementById('file-name');
        const convertBtn = document.getElementById('convert-btn');
        const outputEditor = document.getElementById('output-editor');
        const previewPane = document.getElementById('preview-pane');
        const copyBtn = document.getElementById('copy-btn');
        const downloadBtn = document.getElementById('download-btn');
        const statusArea = document.getElementById('status-area');
        const progressBar = document.getElementById('progress-bar');
        const statusText = document.getElementById('status-text');
        const statusPercent = document.getElementById('status-percent');
        
        // Layout Elements
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const resizer = document.getElementById('resizer');
        const leftPanel = document.getElementById('left-panel');
        const rightPanel = document.getElementById('right-panel');
        const mainSection = document.getElementById('main-section');

        // --- Event Listeners ---
        
        // Drag & Drop
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-active'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('drag-active'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-active');
            handleFile(e.dataTransfer.files[0]);
        });
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

        // Settings Toggles
        document.getElementById('opt-headers').addEventListener('change', (e) => state.heuristics.detectHeaders = e.target.checked);
        document.getElementById('opt-footers').addEventListener('change', (e) => state.heuristics.stripFooters = e.target.checked);
        document.getElementById('opt-breaks').addEventListener('change', (e) => state.heuristics.smartParagraphs = e.target.checked);
        document.getElementById('opt-page-breaks').addEventListener('change', (e) => state.heuristics.removePageBreaks = e.target.checked);

        // Sidebar Toggle - Fixed Logic for Desktop & Mobile
        sidebarToggle.addEventListener('click', () => {
            // We use getComputedStyle to check actual visibility because md:flex overrides hidden class
            const isHidden = window.getComputedStyle(sidebar).display === 'none';
            
            if (isHidden) {
                // To show: remove hidden, ensure flex is added
                sidebar.classList.remove('hidden');
                sidebar.classList.add('flex');
            } else {
                // To hide: add hidden, remove flex, AND remove md:flex (which forces display on desktop)
                sidebar.classList.add('hidden');
                sidebar.classList.remove('flex');
                sidebar.classList.remove('md:flex');
            }
        });

        // Resizer Logic
        let isResizing = false;

        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            document.body.style.cursor = 'col-resize';
            resizer.classList.add('resizing');
            leftPanel.style.userSelect = 'none';
            rightPanel.style.userSelect = 'none';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const containerRect = mainSection.getBoundingClientRect();
            // Calculate percentage width for left panel
            let newWidth = ((e.clientX - containerRect.left) / containerRect.width) * 100;
            
            // Constraints (10% to 90%)
            if (newWidth < 10) newWidth = 10;
            if (newWidth > 90) newWidth = 90;

            leftPanel.style.width = `${newWidth}%`;
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = '';
                resizer.classList.remove('resizing');
                leftPanel.style.userSelect = '';
                rightPanel.style.userSelect = '';
            }
        });

        // Actions
        convertBtn.addEventListener('click', convertFile);
        
        // Sync Editor to Preview
        outputEditor.addEventListener('input', () => {
            updatePreview(outputEditor.value);
        });

        copyBtn.addEventListener('click', () => {
            outputEditor.select();
            document.execCommand('copy');
            const icon = copyBtn.querySelector('i');
            icon.classList.remove('fa-copy');
            icon.classList.add('fa-check');
            setTimeout(() => {
                icon.classList.remove('fa-check');
                icon.classList.add('fa-copy');
            }, 1000);
        });

        downloadBtn.addEventListener('click', () => {
            const blob = new Blob([outputEditor.value], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `extracted_${Date.now()}.md`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // --- Core Logic ---

        function handleFile(file) {
            if (!file || file.type !== 'application/pdf') {
                alert('Please upload a valid PDF file.');
                return;
            }
            state.file = file;
            fileNameDisplay.innerText = file.name;
            convertBtn.disabled = false;
        }

        function updatePreview(markdown) {
            if (!markdown.trim()) {
                previewPane.innerHTML = '<p class="text-slate-400 italic text-center mt-10">Preview will appear here...</p>';
                return;
            }
            // Use Marked.js to parse markdown
            previewPane.innerHTML = marked.parse(markdown);
        }

        async function convertFile() {
            if (!state.file) return;

            state.isProcessing = true;
            convertBtn.disabled = true;
            outputEditor.value = "";
            statusArea.classList.remove('hidden');
            updateProgress(0, "Initializing...");

            try {
                const arrayBuffer = await state.file.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument(arrayBuffer);
                const pdf = await loadingTask.promise;

                // Step 1: Analyze Font Statistics
                updateProgress(5, "Analyzing Document Structure...");
                const fontStats = await analyzeFonts(pdf);
                
                // Step 2: Extract and Process Text
                let finalOutput = "";
                
                for (let i = 1; i <= pdf.numPages; i++) {
                    updateProgress(Math.round((i / pdf.numPages) * 100), `Processing page ${i} of ${pdf.numPages}...`);
                    
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 1.0 });
                    const textContent = await page.getTextContent();
                    
                    const pageText = processPageText(textContent.items, viewport, fontStats, i);
                    finalOutput += pageText;
                }

                outputEditor.value = finalOutput;
                updatePreview(finalOutput); // Initial render
                updateProgress(100, "Done!");

            } catch (error) {
                console.error(error);
                alert("Error parsing PDF: " + error.message);
                updateProgress(0, "Error occurred");
            } finally {
                state.isProcessing = false;
                convertBtn.disabled = false;
                setTimeout(() => statusArea.classList.add('hidden'), 2000);
            }
        }

        async function analyzeFonts(pdf) {
            const fontSizes = {};
            const samplePages = Math.min(pdf.numPages, 5);

            for (let i = 1; i <= samplePages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                
                textContent.items.forEach(item => {
                    if (!item.str.trim()) return;
                    const height = Math.round(Math.abs(item.transform[3])); 
                    if (height > 0) {
                        fontSizes[height] = (fontSizes[height] || 0) + item.str.length;
                    }
                });
            }

            let maxCount = 0;
            let bodySize = 10;
            for (const size in fontSizes) {
                if (fontSizes[size] > maxCount) {
                    maxCount = fontSizes[size];
                    bodySize = parseInt(size);
                }
            }
            return { bodySize };
        }

        function processPageText(items, viewport, fontStats, pageNum) {
            const yTolerance = 2; 

            const sortedItems = items.sort((a, b) => {
                const yA = a.transform[5];
                const yB = b.transform[5];
                if (Math.abs(yA - yB) < yTolerance) {
                    return a.transform[4] - b.transform[4];
                }
                return yB - yA;
            });

            const height = viewport.height;
            const filteredItems = sortedItems.filter(item => {
                if (!item.str.trim()) return false;
                
                if (state.heuristics.stripFooters) {
                    const y = item.transform[5];
                    const isTop = y > height * 0.95;
                    const isBottom = y < height * 0.05;
                    if (isTop || isBottom) return false;
                }
                return true;
            });

            let output = "";
            let currentLineY = -1;
            let currentBlock = "";
            
            filteredItems.forEach((item, index) => {
                const fontSize = Math.abs(item.transform[3]);
                const y = item.transform[5];
                let text = item.str;

                let prefix = "";
                let suffix = "";
                
                if (state.heuristics.detectHeaders) {
                    if (fontSize > fontStats.bodySize * 1.5) {
                        prefix = "## ";
                    } else if (fontSize > fontStats.bodySize * 1.1) {
                        prefix = "### ";
                    }
                }

                if (currentLineY === -1) {
                    currentBlock += prefix + text + suffix;
                    currentLineY = y;
                } else {
                    const dy = currentLineY - y; 
                    
                    if (Math.abs(dy) < 5) {
                        if (!currentBlock.endsWith("-")) currentBlock += " ";
                        else currentBlock = currentBlock.slice(0, -1);
                        currentBlock += prefix + text + suffix;
                    } else {
                        const isNewParagraph = dy > (fontSize * 1.5);
                        
                        if (state.heuristics.smartParagraphs && !isNewParagraph && prefix === "") {
                             if (!currentBlock.endsWith("-")) currentBlock += " ";
                             else currentBlock = currentBlock.slice(0, -1);
                             currentBlock += text;
                        } else {
                            output += currentBlock + "\n\n";
                            currentBlock = prefix + text + suffix;
                        }
                    }
                    currentLineY = y;
                }
            });

            output += currentBlock + "\n\n";

            if (!state.heuristics.removePageBreaks) {
                output += `\n<!-- Page ${pageNum} -->\n\n`;
            }

            return output;
        }

        function updateProgress(percent, text) {
            progressBar.style.width = `${percent}%`;
            statusPercent.innerText = `${percent}%`;
            statusText.innerText = text;
        }
    </script>
</body>
</html>
